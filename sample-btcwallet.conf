[Application Options]

; ------------------------------------------------------------------------------
; Bitcoin wallet settings
; ------------------------------------------------------------------------------

; Use testnet (cannot be used with testnet4=1, obtcmainnet=1, obtctestnet=1,
; simnet=1, signet=1, regtest=1 or obtcregtest=1).
; testnet=0

; Use testnet4 (cannot be used with testnet=1, obtcmainnet=1, obtctestnet=1,
; simnet=1, signet=1, regtest=1 or obtcregtest=1).
; testnet4=0

; Use the OBTC main network (cannot be used with testnet=1, testnet4=1,
; obtctestnet=1, simnet=1, signet=1, regtest=1 or obtcregtest=1).
; Mainnet-candidate safety: leave this disabled unless you are operating a
; reviewed mainnet-candidate wallet. Do not use this sample configuration with
; valuable mainnet funds until the documented readiness gaps are closed.
; obtcmainnet=0

; Use the OBTC test network (cannot be used with testnet=1, testnet4=1,
; obtcmainnet=1, simnet=1, signet=1, regtest=1 or obtcregtest=1).
; obtctestnet=0

; Use simnet (cannot be used with testnet=1, testnet4=1, obtcmainnet=1,
; obtctestnet=1, signet=1, regtest=1 or obtcregtest=1).
; simnet=0

; Use regtest (cannot be used with testnet=1, testnet4=1, obtcmainnet=1,
; obtctestnet=1, simnet=1, signet=1 or obtcregtest=1).
; regtest=0

; Use the OBTC regression test network (cannot be used with testnet=1,
; testnet4=1, obtcmainnet=1, obtctestnet=1, simnet=1, signet=1 or regtest=1).
; obtcregtest=0

; The directory to open and save wallet, transaction, and unspent transaction
; output files. Network-specific directories such as `mainnet`, `testnet`,
; `testnet4`, `obtcmainnet`, `obtctestnet`, and `obtcregtest` are created
; underneath this directory as needed.
; appdata=~/.btcwallet

; DEPRECATED -- use appdata instead.
; datadir=


; ------------------------------------------------------------------------------
; RPC client settings
; ------------------------------------------------------------------------------

; Connect via a SOCKS5 proxy.  NOTE: Specifying a proxy will disable listening
; for incoming connections unless listen addresses are provided via the
; 'rpclisten' option.
; proxy=127.0.0.1:9050
; proxyuser=
; proxypass=

; The server and port used for btcd websocket connections. The default depends
; on the selected network. OBTC defaults use explicit loopback addresses:
; obtcmainnet 127.0.0.1:9528, obtctestnet 127.0.0.1:19528, and
; obtcregtest 127.0.0.1:29528.
; rpcconnect=localhost:8334

; File containing root certificates to authenticate a TLS connections with btcd
; cafile=~/.btcwallet/btcd.cert



; ------------------------------------------------------------------------------
; RPC server settings
; ------------------------------------------------------------------------------

; TLS certificate and key file locations
; rpccert=~/.btcwallet/rpc.cert
; rpckey=~/.btcwallet/rpc.key

; Enable one time TLS keys.  This option results in the process generating
; a new certificate pair each startup, writing only the certificate file
; to disk.  This is a more secure option for clients that only interact with
; a local wallet process where persistent certs are not needed.
;
; This option will error at startup if the key specified by the rpckey option
; already exists.
; onetimetlskey=0

; Specify the interfaces for the legacy JSON-RPC server to listen on. One
; rpclisten address per line. Multiple rpclisten options may be set in the same
; configuration, and each will be used to listen for connections. NOTE: The
; default port is modified by network options such as 'obtcmainnet' or
; 'obtctestnet'. OBTC legacy RPC defaults are 9554, 19554, and 29554.
; Default:
; rpclisten=
; rpclisten=0.0.0.0         ; all ipv4 interfaces on default port
; rpclisten=::              ; all ipv6 interfaces on default port
; rpclisten=:8332           ; all interfaces on port 8332
; rpclisten=0.0.0.0:8332    ; all ipv4 interfaces on port 8332
; rpclisten=[::]:8332       ; all ipv6 interfaces on port 8332
; rpclisten=127.0.0.1:8332  ; only ipv4 localhost on port 8332
; rpclisten=[::1]:8332      ; only ipv6 localhost on port 8332
; rpclisten=127.0.0.1:8337  ; only ipv4 localhost on non-standard port 8337
; rpclisten=:8337           ; all interfaces on non-standard port 8337
; rpclisten=0.0.0.0:8337    ; all ipv4 interfaces on non-standard port 8337
; rpclisten=[::]:8337       ; all ipv6 interfaces on non-standard port 8337

; The experimental gRPC server uses experimentalrpclisten below. It cannot share
; an address with the legacy JSON-RPC server above.



; ------------------------------------------------------------------------------
; RPC settings (both client and server)
; ------------------------------------------------------------------------------

; Username and password to authenticate to btcd a RPC server and authenticate
; new client connections
; username=
; password=

; Alternative username and password for btcd.  If set, these will be used
; instead of the username and password set above for authentication to a
; btcd RPC server.
; btcdusername=
; btcdpassword=


; ------------------------------------------------------------------------------
; Debug
; ------------------------------------------------------------------------------

; Debug logging level.
; Valid options are {trace, debug, info, warn, error, critical}
; debuglevel=info

; The port used to listen for HTTP profile requests.  The profile server will   
; be disabled if this option is not specified.  The profile information can be
; accessed at http://localhost:<profileport>/debug/pprof once running.
; profile=6062

; Directory to log output.
; logdir=~/.btcwallet/logs


; ------------------------------------------------------------------------------
; Wallet settings
; ------------------------------------------------------------------------------

; The timeout value to use when opening the wallet database.
; dbtimeout=1m

; The public wallet password -- Only required if the wallet was created with one.
; walletpass=

; Create the wallet if it does not exist.
; create=0

; Create a temporary simulation wallet (pass=password) in the data directory indicated.
; createtemp=0

; Defer wallet creation/opening on startup and enable loading wallets over RPC.
; noinitialload=0

; Enable OBTC auto-renew scheduler in wallet process.
; autorenew=0

; Interval between auto-renew runs.
; autorenewinterval=30m

; Backoff duration after failed auto-renew runs (0 to disable).
; autorenewfailurebackoff=15m

; Renew amount in the selected network coin per selected UTXO.
; NOTE: must be > 0 when autorenew=1.
; autorenewamount=0

; Maximum total renew amount in the selected network coin per run (0 means
; unlimited).
; autorenewmaxrenewamountperrun=0

; Minimum confirmations required for auto-renew candidate UTXOs.
; autorenewminconf=0

; Auto-renew window bounds for blocks_to_expiry.
; Trigger condition: window_end <= blocks_to_expiry <= window_start.
; autorenewwindowstart=52560
; autorenewwindowend=25920

; Maximum number of UTXOs to renew in one run.
; autorenewmaxutxos=100

; Maximum fee rate in sat/KB used by auto-renew transactions.
; autorenewmaxfeerate=5000

; Expiry window in blocks used by auto-renew candidate calculation.
; autorenewexpirywindow=3679200

; Expiring threshold in blocks used by status classification.
; autorenewexpiringthreshold=25920


; ------------------------------------------------------------------------------
; Peer-to-peer networking
; ------------------------------------------------------------------------------

; Enables the experimental use of SPV rather than RPC for chain synchronization.
; usespv=0

; Add a peer to connect with at startup.
; addpeer=

; Connect only to the specified peers at startup.
; connect=

; Max number of inbound and outbound peers.
; maxpeers=125

; How long to ban misbehaving peers. Valid time units are {s, m, h}.
; banduration=24h

; Maximum allowed ban score before disconnecting and banning misbehaving peers.
; banthreshold=100


; ------------------------------------------------------------------------------
; Alternative networks
; ------------------------------------------------------------------------------

; Use the signet test network.
; signet=0

; Connect to a custom signet network defined by this challenge instead of using
; the global default signet test network.
; signetchallenge=

; Specify a seed node for the signet network instead of using the global default
; signet network seed nodes.
; signetseednode=


; ------------------------------------------------------------------------------
; Advanced RPC settings
; ------------------------------------------------------------------------------

; Disable TLS for the RPC client -- NOTE: This is only allowed if the RPC client
; is connecting to localhost.
; noclienttls=0

; Disable TLS for the RPC server -- NOTE: This is only allowed if the RPC server
; is bound to localhost.
; noservertls=0

; Max number of legacy RPC clients for standard connections.
; rpcmaxclients=10

; Max number of legacy RPC websocket connections.
; rpcmaxwebsockets=25

; Listen for RPC connections on this interface/port.
; experimentalrpclisten=

; Address of a remote signer gRPC server used by the experimental agent wallet
; signer backend.
; agentremotesigneraddr=

; File containing root certificates to authenticate the remote signer gRPC
; server.
; agentremotesignercafile=

; Disable TLS for the remote signer gRPC client -- NOTE: This is only allowed
; if the remote signer is bound to localhost.
; agentremotesignernotls=0

; Override the TLS server name used by the remote signer gRPC client.
; agentremotesignerservername=

; Optional bearer token used for remote signer gRPC authentication.
; agentremotesignerauthtoken=

; Timeout used when dialing the remote signer gRPC server.
; agentremotesignerdialtimeout=5s
